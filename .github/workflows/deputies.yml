name: Collect deputy profiles

# Monthly: profiles and photos change rarely, and deploys never call the
# Câmara, so the site uses the profiles committed here.
on:
  schedule:
    - cron: "0 10 1 * *" # day 1 of each month, 07:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write # commit the profiles and photos
  id-token: write # Sigstore signing certificate
  attestations: write

# Shares collect.yml's group: both commit to main.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  deputies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Writes only after the whole collection succeeds; only new deputies'
      # photos download.
      - run: pnpm data:deputies

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            static/deputados.json
            static/deputados-mandatos.json
            static/deputados-qualidade-entrada.json

      - name: Commit the profiles
        run: |
          git add -A static/deputados.json static/deputados-mandatos.json static/deputados-qualidade-entrada.json static/fotos/deputados
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect deputy profiles

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git pull --rebase
          git push
