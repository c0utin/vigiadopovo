name: Collect official data

# Collection runs on GitHub-hosted runners from the public code, so the
# attestations below bind each output file to this workflow, commit and run.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write # commit the new collection
  id-token: write # Sigstore signing certificate
  attestations: write
  actions: write # start the Pages deploy (pushes by GITHUB_TOKEN do not)

# data:sync is single-writer.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm data:sync
      - run: pnpm test
      - run: pnpm check
      - run: pnpm format:check

      - id: manifest
        name: Locate this collection's manifest
        run: |
          hash=$(jq -r .manifestHash src/lib/data/provenance.json)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "path=static/pipeline/v1/manifests/$hash.json" >> "$GITHUB_OUTPUT"
          git diff --quiet -- src/lib/data/provenance.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Proofs live outside /pipeline/v1/ because the upgrade rewrites them,
      # while v1/ is served as immutable.
      - name: Timestamp the manifest with OpenTimestamps
        if: steps.manifest.outputs.changed == 'true'
        run: |
          mkdir -p static/pipeline/timestamps
          npx -y -p opentimestamps@0.4.9 ots-cli.js stamp "${{ steps.manifest.outputs.path }}"
          mv "${{ steps.manifest.outputs.path }}.ots" \
            "static/pipeline/timestamps/${{ steps.manifest.outputs.hash }}.json.ots"

      # Pending proofs become self-contained once Bitcoin confirms (hours).
      - name: Upgrade earlier timestamps
        run: |
          shopt -s nullglob
          for proof in static/pipeline/timestamps/*.ots; do
            npx -y -p opentimestamps@0.4.9 ots-cli.js upgrade "$proof" || true
          done
          rm -f static/pipeline/timestamps/*.bak

      - name: Attest the collection outputs
        if: steps.manifest.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.manifest.outputs.path }}
            static/legislativo.json
            static/dados.json

      - id: commit
        name: Commit the collection
        run: |
          git add -A data src/lib/data static
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect official data ($(jq -r .collectedAt src/lib/data/provenance.json))

          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Someone may have pushed during the run; attestations cover file
          # contents, so rebasing the data commit keeps them valid.
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the new collection
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # Separate job: a lake failure never blocks the attested collection above.
  lake:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAKE_TOKEN: ${{ secrets.LAKE_TOKEN }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restores the compiled dependencies that lake.yml saves from main
      # (keyed by Cargo.lock and lake/rust-toolchain.toml), so only lake/src
      # compiles here. Read-only: one writer keeps the cache complete.
      - run: rustup toolchain install
        working-directory: lake
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: lake
          shared-key: lake
          save-if: false
      # Stops before any write or query once a free allowance reaches 80%.
      - run: pnpm budget
      - run: pnpm data:lake
      # Publishes the Worker's metrics; visitors never run queries.
      - run: pnpm data:metrics
